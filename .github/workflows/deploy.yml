# A version tag (v0.8.2) runs the tests, then deploys that commit to Fly.io.
# Needs the repository secret FLY_API_TOKEN: `flyctl tokens create deploy -a bepbench`.
name: Deploy

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test
        env:
          BEP_PERF: "1"
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy -a bepbench --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 20 https://bepbench.fly.dev/healthz && exit 0
            sleep 10
          done
          echo "healthz did not answer" && exit 1
