        quality: { min_words: 30 }
      - id: signatories
        label: Approval Signatories
        type: table
        required: true
        weight: 1.2
        quality: { min_rows: 2 }
        columns:
          - { id: name, label: Name, type: text, required: true }
          - { id: role, label: Role, type: text, required: true }
          - { id: organisation, label: Organisation, type: text, required: true }
          - { id: date, label: Date, type: date, width: "130px" }

checks:
  - id: uses_have_owners
    rule: table_column_filled
    section: objectives_uses
    field: bim_uses
    column: owner
    severity: blocker
    message: "Every agreed BIM use must name the task team responsible for delivering it."
    fix: "Open BIM Objectives and Uses and fill the Responsible Task Team column."

  - id: uses_have_evidence
    rule: table_column_filled
    section: objectives_uses
    field: bim_uses
    column: output
    severity: major
    message: "A BIM use with no stated output cannot be verified at a milestone."

  - id: milestones_dated
    rule: table_column_filled
    section: delivery_strategy
    field: milestones
    column: date
    severity: blocker
    message: "Delivery milestones without dates cannot be programmed or audited."

  - id: milestones_acceptance
    rule: table_column_filled
    section: delivery_strategy
    field: milestones
    column: acceptance
    severity: major
    message: "Each milestone needs acceptance criteria, otherwise delivery cannot be accepted or rejected."

  - id: roles_named
    rule: table_column_filled
    section: team_roles
    field: key_roles
    column: name
    severity: blocker
    message: "Information management functions must resolve to named individuals, not organisations."

  - id: risks_owned
    rule: table_column_filled
    section: risk
    field: risk_register
    column: owner
    severity: major
    message: "Unowned risks are not managed risks."

  - id: eir_all_answered
    rule: table_column_filled
    section: information_requirements
    field: eir_response
    column: how
    severity: major
    message: "Each EIR clause response needs a justification or method statement."

  - id: security_triage_done
    rule: field_not_value
    section: security
    field: security_triage
    value: "Triage not yet performed"
    severity: major
    message: "ISO 19650-5 security triage must be completed before the plan is issued."

  - id: loin_covers_milestones
    rule: min_rows
    section: information_requirements
    field: loin
    min: 4
    severity: major
    message: "Level of Information Need is defined for too few elements to drive production."

  - id: tidp_teams_covered
    rule: values_cover
    section: delivery_strategy
    field: tidp_summary
    column: team
    against_section: team_roles
    against_field: task_teams
    against_column: team
    severity: major
    message: "Every task team declared in the delivery team must appear in the TIDP summary."
    fix: "Add a TIDP row for each task team, or remove the team if it has no deliverables."

  - id: uses_owner_known
    rule: values_subset_of
    section: objectives_uses
    field: bim_uses
    column: owner
    against_section: team_roles
    against_field: task_teams
    against_column: team
    severity: minor
    message: "A BIM use is assigned to a team that is not listed in the delivery team structure."

  - id: software_covers_models
    rule: values_subset_of
    section: modelling_federation
    field: model_breakdown
    column: software
    against_section: technology
    against_field: software_stack
    against_column: software
    severity: minor
    message: "Authoring software used in the model breakdown is not listed in the technology stack."

  - id: approval_signed
    rule: min_rows
    section: approval
    field: signatories
    min: 2
    severity: minor
    message: "A BEP needs signatories from both the appointing and lead appointed party."
